name: daily-topics

on:
  schedule:
    # 22:45 UTC = 次日 06:45 北京时间；偏移分钟以抵消 Actions 整点拥堵延迟
    - cron: "45 22 * * *"
  workflow_dispatch: {}   # 手动重跑 / 调试入口

permissions:
  contents: write

concurrency:
  group: daily-topics
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate and push digest
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BARK_ENDPOINT: ${{ secrets.BARK_ENDPOINT }}
          TZ: Asia/Shanghai
        run: python -m scripts.main

      - name: Commit state and pages
        run: |
          git config user.name  "topic-radar-bot"
          git config user.email "topic-radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: daily digest $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
